table: public.subscriptions
description: >
  One row per user's subscription (one per user, so plan switches are not visible).
  Use it for plans, active subscriptions, churn and churn rate, and tenure bands.
  Read monthly churn from missed renewals in public.payments (missed_monthly_renewals),
  annual churn from end_date, never from status.

fields:
  - name: subscription_id
    type: integer
    description: Unique identifier for the subscription.
    role: entity

  - name: user_id
    type: integer
    description: The user who holds the subscription. Joins to public.users.user_id.
    role: relationship

  - name: plan
    type: text
    description: The subscription plan. One of free, monthly or annual. Free subscriptions never end and have no end_date, so leave them out of any churn or retention calculation.
    role: dimension

  - name: start_date
    type: timestamp
    description: >
      Date and time when the subscription started. A start after the analysis date hasn't
      happened yet, so leave those subscriptions out of every count. It holds scheduled
      starts, so it never sets the analysis date.
    role: dimension

  - name: end_date
    type: timestamp
    description: >
      Date when the subscription ended or is scheduled to end. Empty means the subscription
      is active. A date after the analysis date is a scheduled cancellation, and that
      subscription is still active today. Monthly end dates are midnight and exactly 30 days
      after the last charge until September 2025; from October 2025 they fall anywhere from 1
      to over 31 days after it, so don't time monthly churn by end_date. Annual churn is read
      from this field.
    role: dimension

  - name: status
    type: text
    description: >
      Label on the subscription. One of active, expired or canceled. The label for ended
      subscriptions switched from expired to canceled for end dates from August 2026 on,
      and scheduled cancellations are labelled canceled while still active. Never read
      churn or active counts from status.
    role: dimension

relationships:
  - field: user_id
    references: public.users.user_id
    relationship_type: one_to_one
    description: One subscription per user (true in the data, not enforced by the schema), so the join never duplicates rows. Users on a running trial have no subscription yet; LEFT JOIN from users when they should still count.

measures:
  - name: paid_subscriptions_at_period_start
    formula: COUNT(subscription_id) FILTER (WHERE plan IN ('monthly', 'annual') AND start_date < period_start AND (end_date IS NULL OR end_date >= period_start))
    description: Paid subscriptions active at the start of the period, the denominator of every churn rate.

  - name: churned_subscriptions
    formula: COUNT(subscription_id) FILTER (WHERE plan IN ('monthly', 'annual') AND start_date < period_start AND end_date >= period_start AND end_date < LEAST(period_end, analysis_date + INTERVAL '1 day'))
    description: >
      Paid subscriptions active at the start of the period whose end_date falls in the period,
      up to the analysis date; later end dates are scheduled cancellations, still active.
      Churn rates use paid plans only, dividing by paid subscriptions active at the start of the period.
      Use it for annual plans; for monthly plans use missed_monthly_renewals in public.payments.

derived_dimensions:
  - name: tenure_band
    description: >
      How long a subscriber had been paying at the start of the period being
      analysed. Beam cuts tenure into these four bands and no others, so that
      groups compare across analyses.
    formula: |
      CASE
        WHEN period_start - start_date < INTERVAL '6 months'  THEN 'under 6 months'
        WHEN period_start - start_date < INTERVAL '12 months' THEN '6 to 12 months'
        WHEN period_start - start_date < INTERVAL '24 months' THEN '12 to 24 months'
        ELSE 'over 24 months'
      END

golden_queries:
  - name: monthly_paid_churn_rate
    description: Monthly churn rate for paid plans, the share of paid subscriptions active at the start of each month that ended during it
    sql: |
      WITH months AS (
        SELECT generate_series(DATE '2026-01-01', DATE '2026-08-01', INTERVAL '1 month')::date AS month_start
      )
      SELECT m.month_start,
             COUNT(*) AS paid_at_month_start,
             COUNT(*) FILTER (WHERE s.end_date < m.month_start + INTERVAL '1 month') AS churned_subscriptions,
             ROUND(COUNT(*) FILTER (WHERE s.end_date < m.month_start + INTERVAL '1 month')::numeric / COUNT(*), 4) AS churn_rate
      FROM months m
      JOIN public.subscriptions s
        ON s.plan IN ('monthly', 'annual')
       AND s.start_date < m.month_start
       AND (s.end_date IS NULL OR s.end_date >= m.month_start)
      GROUP BY m.month_start
      ORDER BY m.month_start;

  - name: paid_churn_rate_by_country
    description: Monthly paid churn rate per country, January to August 2026
    sql: |
      WITH months AS (
        SELECT generate_series(DATE '2026-01-01', DATE '2026-08-01', INTERVAL '1 month')::date AS month_start
      )
      SELECT m.month_start,
             u.country,
             COUNT(*) AS paid_at_month_start,
             COUNT(*) FILTER (WHERE s.end_date < m.month_start + INTERVAL '1 month') AS churned_subscriptions,
             ROUND(COUNT(*) FILTER (WHERE s.end_date < m.month_start + INTERVAL '1 month')::numeric / COUNT(*), 4) AS churn_rate
      FROM months m
      JOIN public.subscriptions s
        ON s.plan IN ('monthly', 'annual')
       AND s.start_date < m.month_start
       AND (s.end_date IS NULL OR s.end_date >= m.month_start)
      JOIN public.users u ON u.user_id = s.user_id
      GROUP BY m.month_start, u.country
      ORDER BY m.month_start, u.country;

notes:
  - Bulk start days are blocks, not organic signups; say so whenever one enters a comparison. 2025-09-17 (the September 2025 signup spike, 1,385 paid), 2026-07-30 (403 paid) and 2026-09-25 (582 paid, after the analysis date, none from trials).
