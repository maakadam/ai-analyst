# Read this first to find the table files a question needs, then read those files
# in full before writing SQL.
# Generated by helpers/build_index.py: edit the table files or _index_header.yaml, not this file.

sql_dialect: PostgreSQL

conventions:
  - Write table names with their schema, for example public.subscriptions.
  - period_start (inclusive) and period_end (exclusive) in formulas are filled in by each query.
  - analysis_date in formulas is DATE '2026-09-24', the last day of data. Read "today", "current" and "last month" relative to it; don't use CURRENT_DATE or now().
  - The last complete month is August 2026; September 2026 is partial (to the 24th).
  - Use the defined measures, derived dimensions and joins; don't invent your own.
  - Start from a golden query when one answers the question or a close variant of it.

excluded:   # never query these; use the tables named instead
  - table: marts.user_revenue_summary
    reason: Unverified. No comments in the database, a snapshot from about 2026-07-29, and its payments disagree with public.payments for 2,245 users. Use public.payments and public.subscriptions.

tables:
- table: ml.churn_snapshot
  file: churn_snapshot.yaml
  description: 'One row per user with an active paid subscription on the snapshot date, with activity and payment features and whether the subscription ended in the next 90 days: a training set for churn models. Versioned by snapshot_date and append-only; it holds one snapshot today (2026-04-30, 7,690 subscribers). Read it through the view ml.churn_snapshot_latest, which keeps only the newest snapshot. Its churn label comes from end_date, not from missed renewals, so for monthly churn rates use missed_monthly_renewals in public.payments instead.'
  measures: [snapshot_subscribers, snapshot_churned_90d]
  golden_queries: [churn_within_90d_by_plan]
- table: public.payments
  file: payments.yaml
  description: One row per payment transaction on a subscription. Use it for revenue, paying subscriptions, prices and payment methods.
  measures: [revenue_usd, paying_subscriptions, monthly_renewals_due, missed_monthly_renewals]
  derived_dimensions: [renewal_due_date, next_payment_date]
  golden_queries: [monthly_revenue_by_plan, monthly_revenue_by_method, monthly_renewal_churn_rate]
- table: public.sessions
  file: sessions.yaml
  description: 'One row per app session (about 4.3 million rows, January 2022 to September 2026). Use it for engagement: active users, session counts, minutes and activity type, including what trial users do in their first days. The table is very large: query it only with aggregates (COUNT, SUM, AVG, COUNT DISTINCT) grouped to a small result, never select rows from it, and filter on session_date to keep scans short. Sessions run to 2026-09-26, two days past the analysis date: cap every query at session_date < analysis_date + 1 day.'
  measures: [sessions, active_users, session_minutes]
  derived_dimensions: [session_day, trial_day]
  golden_queries: [monthly_active_users, sessions_by_trial_day]
- table: public.subscriptions
  file: subscriptions.yaml
  description: One row per user's subscription (one per user, so plan switches are not visible). Use it for plans, active subscriptions, churn and churn rate, and tenure bands. Read monthly churn from missed renewals in public.payments (missed_monthly_renewals), annual churn from end_date, never from status.
  measures: [paid_subscriptions_at_period_start, churned_subscriptions]
  derived_dimensions: [tenure_band]
  golden_queries: [monthly_paid_churn_rate, paid_churn_rate_by_country]
- table: ml.trial_snapshot
  file: trial_snapshot.yaml
  description: One row per trial with its first three days of activity and whether it converted, a training set for trial-conversion models. Versioned by snapshot_date and append-only; it holds one snapshot today (2026-09-24, 1,516 trials started 2026-08-01 to 2026-09-09). Read it through the view ml.trial_snapshot_latest, which keeps only the newest snapshot. Use it for conversion by early activity, region or device. For anything past day 3, or trials ending on the snapshot date, use public.trials and public.sessions.
  measures: [snapshot_trials, snapshot_converted_trials]
  golden_queries: [trial_conversion_by_device]
- table: public.trials
  file: trials.yaml
  description: One row per 14-day full-access trial. Use it for trials, trial outcomes and trial-to-paid conversion. Trials launched on 2026-08-01, so there is no trial data before then. A trial converts to a paid plan automatically at ends_at unless the user cancels during it. A converted trial starts a monthly or annual subscription on outcome_at; a canceled trial leaves the user on a free plan starting at ends_at.
  measures: [matured_trials, converted_trials]
  golden_queries: [weekly_trial_conversion_rate]
- table: marts.user_activity_metrics
  file: user_activity_metrics.yaml
  description: One row per day from 2024-01-01 to 2026-09-24 with daily, weekly and monthly active users, built from public.sessions. Use it for active-user trends and stickiness (dau / mau) without scanning sessions. It has no user_id, so it can't be broken down by plan, region or trial; use public.sessions for that.
  measures: [avg_dau, avg_stickiness, period_end_mau]
  derived_dimensions: [activity_month]
  golden_queries: [monthly_stickiness]
- table: public.users
  file: users.yaml
  description: One row per Beam user account. Use it for signups, and to break any metric down by region (country) or signup device.
  measures: [signups]
  derived_dimensions: [signup_month]
  golden_queries: [monthly_signups_by_country]

joins:
- ml.churn_snapshot.user_id → public.users.user_id (one_to_one)
- public.payments.subscription_id → public.subscriptions.subscription_id (many_to_one)
- public.sessions.user_id → public.users.user_id (many_to_one)
- public.subscriptions.user_id → public.users.user_id (one_to_one)
- ml.trial_snapshot.trial_id → public.trials.trial_id (one_to_one)
- public.trials.user_id → public.users.user_id (one_to_one)
