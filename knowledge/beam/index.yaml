# Read this first to find the table files a question needs, then read those files
# in full before writing SQL.
# Generated by helpers/build_index.py: edit the table files or _index_header.yaml, not this file.

sql_dialect: PostgreSQL

conventions:
  - Write table names with their schema, for example public.subscriptions.
  - period_start (inclusive) and period_end (exclusive) in formulas are filled in by each query.
  - analysis_date in formulas is DATE '2026-09-24', the last day of data. Read "today", "current" and "last month" relative to it; don't use CURRENT_DATE or now().
  - The last complete month is August 2026; September 2026 is partial (to the 24th).
  - Use the defined measures, derived dimensions and joins; don't invent your own.
  - Start from a golden query when one answers the question or a close variant of it.

not_yet_covered:   # say a question isn't covered rather than guess
  - public.sessions
  - marts.user_activity_metrics
  - marts.user_revenue_summary
  - ml.churn_snapshot
  - ml.trial_snapshot

tables:
- table: public.payments
  file: payments.yaml
  description: One row per payment transaction on a subscription. Use it for revenue, paying subscriptions, prices and payment methods.
  measures: [revenue_usd, paying_subscriptions, monthly_renewals_due, missed_monthly_renewals]
  derived_dimensions: [renewal_due_date, next_payment_date]
  golden_queries: [monthly_revenue_by_plan, monthly_revenue_by_method, monthly_renewal_churn_rate]
- table: public.subscriptions
  file: subscriptions.yaml
  description: One row per user's subscription (one per user, so plan switches are not visible). Use it for plans, active subscriptions, churn and churn rate, and tenure bands. Read monthly churn from missed renewals in public.payments (missed_monthly_renewals), annual churn from end_date, never from status.
  measures: [paid_subscriptions_at_period_start, churned_subscriptions]
  derived_dimensions: [tenure_band]
  golden_queries: [monthly_paid_churn_rate, paid_churn_rate_by_country]
- table: public.trials
  file: trials.yaml
  description: One row per 14-day full-access trial. Use it for trials, trial outcomes and trial-to-paid conversion. Trials launched on 2026-08-01, so there is no trial data before then. A trial converts to a paid plan automatically at ends_at unless the user cancels during it. A converted trial starts a monthly or annual subscription on outcome_at; a canceled trial leaves the user on a free plan starting at ends_at.
  measures: [matured_trials, converted_trials]
  golden_queries: [weekly_trial_conversion_rate]
- table: public.users
  file: users.yaml
  description: One row per Beam user account. Use it for signups, and to break any metric down by region (country) or signup device.
  measures: [signups]
  derived_dimensions: [signup_month]
  golden_queries: [monthly_signups_by_country]

joins:
- public.payments.subscription_id → public.subscriptions.subscription_id (many_to_one)
- public.subscriptions.user_id → public.users.user_id (one_to_one)
- public.trials.user_id → public.users.user_id (one_to_one)
