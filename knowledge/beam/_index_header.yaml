# Hand-written part of index.yaml. Edit this file, then run helpers/build_index.py.

sql_dialect: PostgreSQL

conventions:
  - Write table names with their schema, for example public.subscriptions.
  - period_start (inclusive) and period_end (exclusive) in formulas are filled in by each query.
  - analysis_date in formulas is looked up once per run: the earliest MAX(column)::date of the event date columns (fields whose description says "Event date") of the tables in play, or MAX(public.payments.payment_date)::date when none is in play. It is a date, never a timestamp. Read "today", "current" and "last month" relative to it; don't use CURRENT_DATE or now().
  - The month holding analysis_date is partial; the month before it is the last complete one.
  - Use the defined measures, derived dimensions and joins; don't invent your own.
  - Start from a golden query when one answers the question or a close variant of it.

excluded:   # never query these; use the tables named instead
  - table: marts.user_revenue_summary
    reason: Unverified. No comments in the database, a snapshot from about 2026-07-29, and its payments disagree with public.payments for 2,245 users. Use public.payments and public.subscriptions.
